<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ZENO AI</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #080b0f;
            --sidebar: #0d1117;
            --panel: #11161c;
            --panel2: #151b22;
            --border: #252c35;

            --text: #e8edf2;
            --muted: #7d8895;

            --user: #2563eb;
            --user-hover: #1d4ed8;

            --success: #55d98b;
            --danger: #ef4444;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--bg);

            color: var(--text);

            height: 100vh;

            overflow: hidden;
        }


        /* =====================================================
           APP
        ===================================================== */

        .app {

            display: flex;

            width: 100%;

            height: 100vh;
        }


        /* =====================================================
           SIDEBAR
        ===================================================== */

        .sidebar {

            width: 270px;

            height: 100vh;

            background: var(--sidebar);

            border-right:
                1px solid var(--border);

            display: flex;

            flex-direction: column;

            padding: 18px;

            flex-shrink: 0;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

            margin-bottom: 25px;
        }


        .logo {

            width: 40px;

            height: 40px;

            object-fit: contain;

            border-radius: 10px;

            background: #000;
        }


        .brand-name {

            font-size: 20px;

            font-weight: 700;
        }


        .brand-sub {

            font-size: 11px;

            color: var(--muted);

            margin-top: 2px;
        }


        /* =====================================================
           NEW CHAT
        ===================================================== */

        .new-chat {

            width: 100%;

            padding: 12px;

            border-radius: 10px;

            border:
                1px solid var(--border);

            background: var(--panel);

            color: white;

            cursor: pointer;

            text-align: left;

            font-size: 14px;

            margin-bottom: 22px;

            transition: .2s;
        }


        .new-chat:hover {

            background: var(--panel2);

            border-color: #374151;
        }


        /* =====================================================
           HISTORY
        ===================================================== */

        .history-heading {

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: var(--muted);

            font-size: 11px;

            margin-bottom: 10px;

            padding: 0 4px;
        }


        .history-list {

            flex: 1;

            overflow-y: auto;
        }


        .history-item {

            padding: 10px;

            margin-bottom: 4px;

            border-radius: 8px;

            color: #b8c0c9;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: .2s;
        }


        .history-item:hover {

            background: #171d24;

            color: white;
        }


        .history-empty {

            color: #56616e;

            font-size: 12px;

            padding: 10px 5px;
        }


        .clear-history {

            border:
                1px solid var(--border);

            background: transparent;

            color: #858f9c;

            padding: 9px;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 12px;
        }


        .clear-history:hover {

            background: #181e25;

            color: white;
        }


        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            flex: 1;

            min-width: 0;

            height: 100vh;

            display: flex;

            flex-direction: column;
        }


        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {

            height: 62px;

            border-bottom:
                1px solid var(--border);

            display: flex;

            align-items: center;

            padding: 0 25px;

            flex-shrink: 0;
        }


        .top-title {

            font-size: 15px;

            font-weight: 600;
        }


        .online {

            margin-left: auto;

            font-size: 12px;

            color: var(--success);
        }


        /* =====================================================
           CHAT AREA
        ===================================================== */

        .chat-area {

            flex: 1;

            overflow-y: auto;

            padding: 35px 25px;

            scroll-behavior: smooth;
        }


        .chat-container {

            width: 100%;

            max-width: 900px;

            margin: auto;
        }


        /* =====================================================
           WELCOME
        ===================================================== */

        .welcome {

            min-height: 70vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .welcome-box {

            max-width: 650px;
        }


        .welcome-logo {

            width: 80px;

            height: 80px;

            object-fit: contain;

            margin-bottom: 18px;

            border-radius: 18px;
        }


        .welcome h1 {

            font-size: 34px;

            margin-bottom: 12px;
        }


        .welcome p {

            color: var(--muted);

            line-height: 1.6;

            margin-bottom: 25px;
        }


        /* =====================================================
           SUGGESTIONS
        ===================================================== */

        .suggestions {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 9px;
        }


        .suggestion {

            background: #11161c;

            border:
                1px solid var(--border);

            padding: 11px 15px;

            border-radius: 10px;

            color: #bbc3cd;

            cursor: pointer;

            transition: .2s;
        }


        .suggestion:hover {

            background: #1b2128;

            color: white;
        }


        /* =====================================================
           MESSAGE
        ===================================================== */

        .message {

            display: flex;

            margin-bottom: 28px;

            gap: 13px;

            max-width: 850px;

            animation: messageIn .2s ease;
        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .message.user {

            margin-left: auto;

            flex-direction: row-reverse;
        }


        .avatar {

            width: 36px;

            height: 36px;

            min-width: 36px;

            border-radius: 9px;

            object-fit: contain;

            background: #000;

            padding: 3px;
        }


        .message-content {

            max-width: 760px;
        }


        .message-name {

            color: #8994a2;

            font-size: 12px;

            margin-bottom: 6px;
        }


        .message-text {

            line-height: 1.6;

            color: #e9edf1;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .user .message-text {

            background: var(--user);

            padding: 12px 16px;

            border-radius: 13px;
        }


        .copy-button {

            background: transparent;

            border: none;

            color: #697585;

            cursor: pointer;

            font-size: 12px;

            margin-top: 7px;
        }


        .copy-button:hover {

            color: white;
        }


        /* =====================================================
           TYPING
        ===================================================== */

        .typing {

            display: flex;

            gap: 5px;

            padding: 8px 0;
        }


        .typing span {

            width: 7px;

            height: 7px;

            background: #798491;

            border-radius: 50%;

            animation:
                typing 1.2s infinite;
        }


        .typing span:nth-child(2) {

            animation-delay: .15s;
        }


        .typing span:nth-child(3) {

            animation-delay: .3s;
        }


        @keyframes typing {

            0%,
            60%,
            100% {

                transform: translateY(0);

                opacity: .4;
            }

            30% {

                transform: translateY(-5px);

                opacity: 1;
            }
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input-section {

            padding:
                10px 25px 20px;
        }


        .input-wrapper {

            max-width: 900px;

            margin: auto;
        }


        .input-box {

            display: flex;

            align-items: flex-end;

            background: #11161c;

            border:
                1px solid var(--border);

            border-radius: 15px;

            padding: 7px;

            transition: .2s;
        }


        .input-box:focus-within {

            border-color: #3b4654;

            box-shadow:
                0 0 0 2px
                rgba(37, 99, 235, .08);
        }


        #messageInput {

            flex: 1;

            background: transparent;

            color: white;

            border: none;

            outline: none;

            resize: none;

            min-height: 44px;

            max-height: 150px;

            padding: 12px;

            font-family: inherit;

            font-size: 14px;
        }


        #messageInput::placeholder {

            color: #687382;
        }


        #sendButton {

            width: 44px;

            height: 44px;

            border: none;

            border-radius: 10px;

            background: var(--user);

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition: .2s;

            flex-shrink: 0;
        }


        #sendButton:hover {

            background: var(--user-hover);

            transform: translateY(-1px);
        }


        #sendButton:disabled {

            opacity: .5;

            cursor: not-allowed;

            transform: none;
        }


        .input-info {

            text-align: center;

            color: #58636f;

            font-size: 10px;

            margin-top: 8px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media(max-width: 750px) {

            .sidebar {

                display: none;
            }


            .chat-area {

                padding:
                    25px 14px;
            }


            .input-section {

                padding:
                    10px 12px 15px;
            }


            .welcome h1 {

                font-size: 27px;
            }


            .message {

                max-width: 100%;
            }


            .message-content {

                max-width:
                    calc(100vw - 90px);
            }


            .topbar {

                padding: 0 15px;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">


        <div class="brand">

            <img
                src="logo.png"
                class="logo"
                alt="ZENO Logo"
                onerror="this.style.display='none'"
            >

            <div>

                <div class="brand-name">
                    ZENO AI
                </div>

                <div class="brand-sub">
                    AI + MCP + RAG
                </div>

            </div>

        </div>


        <button
            type="button"
            class="new-chat"
            id="newChatButton"
        >
            ＋ New Chat
        </button>


        <div class="history-heading">

            <span>
                CHAT HISTORY
            </span>

        </div>


        <div
            id="historyList"
            class="history-list"
        >

            <div class="history-empty">
                Loading history...
            </div>

        </div>


        <button
            type="button"
            class="clear-history"
            id="clearHistoryButton"
        >
            🗑 Clear History
        </button>


    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">


        <header class="topbar">

            <div class="top-title">
                ZENO AI
            </div>

            <div
                class="online"
                id="onlineStatus"
            >
                ● Connecting...
            </div>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            id="chatArea"
            class="chat-area"
        >

            <div
                id="chatContainer"
                class="chat-container"
            >


                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-box">


                        <img
                            src="logo.png"
                            class="welcome-logo"
                            alt="ZENO"
                            onerror="this.style.display='none'"
                        >


                        <h1>
                            How can I help you?
                        </h1>


                        <p>
                            Ask ZENO anything.
                            AI, coding, data,
                            calculations and more.
                        </p>


                        <div class="suggestions">


                            <button
                                type="button"
                                class="suggestion"
                                data-question="What is Artificial Intelligence?"
                            >
                                What is AI?
                            </button>


                            <button
                                type="button"
                                class="suggestion"
                                data-question="Calculate 25 + 30"
                            >
                                Calculate
                            </button>


                            <button
                                type="button"
                                class="suggestion"
                                data-question="What are my skills?"
                            >
                                My Skills
                            </button>


                            <button
                                type="button"
                                class="suggestion"
                                data-question="What is the current time?"
                            >
                                Current Time
                            </button>


                            <button
                                type="button"
                                class="suggestion"
                                data-question="What is the current Bitcoin price?"
                            >
                                ₿ Bitcoin Price
                            </button>


                        </div>


                    </div>

                </div>


            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <section class="input-section">


            <div class="input-wrapper">


                <div class="input-box">


                    <textarea
                        id="messageInput"
                        placeholder="Message ZENO..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>


                    <button
                        type="button"
                        id="sendButton"
                        title="Send message"
                        aria-label="Send message"
                    >
                        ➤
                    </button>


                </div>


                <div class="input-info">

                    Enter to send
                    • Shift + Enter for new line
                    • ZENO can make mistakes

                </div>


            </div>


        </section>


    </main>


</div>


<script>

/* ============================================================
   ZENO AI FRONTEND
   MCP + RAG + COINGECKO + GEMINI + HISTORY
============================================================ */


/* ============================================================
   CONFIG
============================================================ */

const API_URL =
    "http://127.0.0.1:8000";


/* ============================================================
   ELEMENTS
============================================================ */

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatArea =
    document.getElementById(
        "chatArea"
    );

const chatContainer =
    document.getElementById(
        "chatContainer"
    );

const historyList =
    document.getElementById(
        "historyList"
    );

const onlineStatus =
    document.getElementById(
        "onlineStatus"
    );

const newChatButton =
    document.getElementById(
        "newChatButton"
    );

const clearHistoryButton =
    document.getElementById(
        "clearHistoryButton"
    );


let sending = false;

let messages = [];


/* ============================================================
   BACKEND STATUS
============================================================ */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_URL + "/",
                {
                    method: "GET"
                }
            );


        if (response.ok) {

            onlineStatus.textContent =
                "● Online";

            onlineStatus.style.color =
                "#55d98b";

        }

        else {

            throw new Error(
                "Backend unavailable"
            );
        }

    }

    catch (error) {

        console.warn(
            "[ZENO] Backend status:",
            error
        );

        onlineStatus.textContent =
            "● Offline";

        onlineStatus.style.color =
            "#ef4444";
    }
}


/* ============================================================
   NEW CHAT
============================================================ */

function newChat() {

    messages = [];


    chatContainer.innerHTML = `

        <div
            class="welcome"
            id="welcome"
        >

            <div class="welcome-box">

                <img
                    src="logo.png"
                    class="welcome-logo"
                    alt="ZENO"
                >

                <h1>
                    How can I help you?
                </h1>

                <p>
                    Ask ZENO anything.
                    AI, coding, data,
                    calculations and more.
                </p>

                <div class="suggestions">

                    <button
                        type="button"
                        class="suggestion"
                        data-question="What is Artificial Intelligence?"
                    >
                        What is AI?
                    </button>

                    <button
                        type="button"
                        class="suggestion"
                        data-question="Calculate 25 + 30"
                    >
                        Calculate
                    </button>

                    <button
                        type="button"
                        class="suggestion"
                        data-question="What are my skills?"
                    >
                        My Skills
                    </button>

                    <button
                        type="button"
                        class="suggestion"
                        data-question="What is the current time?"
                    >
                        Current Time
                    </button>

                    <button
                        type="button"
                        class="suggestion"
                        data-question="What is the current Bitcoin price?"
                    >
                        ₿ Bitcoin Price
                    </button>

                </div>

            </div>

        </div>
    `;


    attachSuggestionEvents();


    input.value = "";

    resizeInput();

    input.focus();

    scrollToBottom();
}


/* ============================================================
   SUGGESTIONS
============================================================ */

function attachSuggestionEvents() {

    const buttons =
        document.querySelectorAll(
            ".suggestion"
        );


    buttons.forEach(
        button => {

            button.addEventListener(
                "click",
                function() {

                    const question =
                        this.dataset.question;

                    input.value =
                        question;

                    resizeInput();

                    sendMessage();

                }
            );

        }
    );
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {


    if (sending) {

        return;
    }


    const text =
        input.value.trim();


    if (!text) {

        input.focus();

        return;
    }


    sending = true;


    sendButton.disabled =
        true;

    input.disabled =
        true;


    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {

        welcome.remove();
    }


    input.value = "";

    resizeInput();


    messages.push({

        role: "user",

        text: text

    });


    renderMessage(
        "user",
        text
    );


    showTyping();


    try {


        console.log(
            "[ZENO] Sending:",
            text
        );


        const response =
            await fetch(
                API_URL + "/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message: text

                        })

                }
            );


        console.log(
            "[ZENO] HTTP:",
            response.status
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                "HTTP " +
                response.status +
                ": " +
                errorText
            );
        }


        const data =
            await response.json();


        console.log(
            "[ZENO] Response:",
            data
        );


        removeTyping();


        /*
         * Accept different backend formats:
         *
         * response
         * answer
         * result
         * message
         */

        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Backend returned an error"
            );
        }


        let answer;


        if (
            data.response !== undefined
        ) {

            answer =
                data.response;

        }

        else if (
            data.answer !== undefined
        ) {

            answer =
                data.answer;

        }

        else if (
            data.result !== undefined
        ) {

            answer =
                data.result;

        }

        else if (
            data.message !== undefined
        ) {

            answer =
                data.message;

        }

        else {

            answer =
                data;
        }


        if (
            typeof answer !==
            "string"
        ) {

            answer =
                JSON.stringify(
                    answer,
                    null,
                    2
                );
        }


        messages.push({

            role: "assistant",

            text: answer

        });


        renderMessage(
            "assistant",
            answer
        );


        /*
         * Refresh history.
         *
         * If /history is not yet
         * available, don't break
         * the chatbot.
         */

        await loadHistory();


    }

    catch (error) {


        removeTyping();


        console.error(
            "[ZENO ERROR]",
            error
        );


        renderMessage(
            "assistant",

            "⚠️ ZENO could not connect to the backend.\n\n" +

            "Make sure this command is running:\n\n" +

            "python -m uvicorn backend.api:app --reload\n\n" +

            "Error: " +
            error.message
        );

    }


    finally {

        sending = false;

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();

    }

}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(
    role,
    text,
    scroll = true
) {


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        role;


    const avatar =
        document.createElement(
            "img"
        );


    avatar.className =
        "avatar";


    avatar.src =
        "logo.png";


    avatar.alt =
        "ZENO";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "message-name";


    name.textContent =
        role === "user"
            ? "You"
            : "ZENO";


    const messageText =
        document.createElement(
            "div"
        );


    messageText.className =
        "message-text";


    messageText.textContent =
        String(text);


    content.appendChild(
        name
    );


    content.appendChild(
        messageText
    );


    /*
     * Copy button only for ZENO
     */

    if (
        role === "assistant"
    ) {


        const copyButton =
            document.createElement(
                "button"
            );


        copyButton.type =
            "button";


        copyButton.className =
            "copy-button";


        copyButton.textContent =
            "Copy";


        copyButton.addEventListener(
            "click",
            async function() {

                try {

                    await navigator
                        .clipboard
                        .writeText(
                            String(text)
                        );


                    copyButton.textContent =
                        "Copied!";


                    setTimeout(
                        function() {

                            copyButton.textContent =
                                "Copy";

                        },
                        1500
                    );

                }

                catch (error) {

                    console.error(
                        error
                    );

                    copyButton.textContent =
                        "Copy failed";

                }

            }
        );


        content.appendChild(
            copyButton
        );

    }


    message.appendChild(
        avatar
    );


    message.appendChild(
        content
    );


    chatContainer.appendChild(
        message
    );


    if (scroll) {

        scrollToBottom();

    }


    return message;
}


/* ============================================================
   TYPING
============================================================ */

function showTyping() {


    removeTyping();


    const message =
        document.createElement(
            "div"
        );


    message.id =
        "typingMessage";


    message.className =
        "message assistant";


    message.innerHTML = `

        <img
            src="logo.png"
            class="avatar"
            alt="ZENO"
        >

        <div class="message-content">

            <div class="message-name">
                ZENO
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chatContainer.appendChild(
        message
    );


    scrollToBottom();
}


/* ============================================================
   REMOVE TYPING
============================================================ */

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );


    if (typing) {

        typing.remove();

    }
}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

    setTimeout(
        function() {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        30
    );
}


/* ============================================================
   INPUT RESIZE
============================================================ */

function resizeInput() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";
}


/* ============================================================
   LOAD HISTORY
============================================================ */

async function loadHistory() {


    try {


        const response =
            await fetch(
                API_URL +
                "/history"
            );


        /*
         * Backend currently may not
         * have /history.
         *
         * In that case don't show
         * an application error.
         */

        if (
            response.status === 404
        ) {

            historyList.innerHTML = `

                <div class="history-empty">
                    Chat history endpoint not available
                </div>

            `;

            return;
        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        historyList.innerHTML =
            "";


        let history = [];


        if (
            Array.isArray(
                data.history
            )
        ) {

            history =
                data.history;

        }

        else if (
            Array.isArray(data)
        ) {

            history =
                data;

        }


        if (
            history.length === 0
        ) {

            historyList.innerHTML = `

                <div class="history-empty">
                    No conversations yet
                </div>

            `;

            return;
        }


        history.forEach(
            function(chat) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                let userMessage = "";

                let botResponse = "";


                if (
                    typeof chat ===
                    "string"
                ) {

                    userMessage =
                        chat;

                }

                else {

                    userMessage =
                        chat.user_message ||
                        chat.message ||
                        chat.question ||
                        "";


                    botResponse =
                        chat.ai_response ||
                        chat.bot_response ||
                        chat.response ||
                        chat.answer ||
                        "";

                }


                item.textContent =
                    userMessage ||
                    "Chat";


                item.title =
                    userMessage ||
                    "Chat";


                item.addEventListener(
                    "click",
                    function() {


                        newChat();


                        const welcome =
                            document.getElementById(
                                "welcome"
                            );


                        if (welcome) {

                            welcome.remove();

                        }


                        if (userMessage) {

                            renderMessage(
                                "user",
                                userMessage
                            );

                        }


                        if (botResponse) {

                            renderMessage(
                                "assistant",
                                botResponse
                            );

                        }

                    }
                );


                historyList.appendChild(
                    item
                );

            }
        );


    }

    catch (error) {


        console.warn(
            "[HISTORY]",
            error
        );


        historyList.innerHTML = `

            <div class="history-empty">
                No history available
            </div>

        `;

    }
}


/* ============================================================
   CLEAR HISTORY
============================================================ */

async function clearHistory() {


    const confirmed =
        confirm(
            "Delete all ZENO chat history?"
        );


    if (!confirmed) {

        return;
    }


    try {


        const response =
            await fetch(
                API_URL +
                "/history",
                {

                    method:
                        "DELETE"

                }
            );


        if (
            response.status === 404
        ) {

            alert(
                "The backend /history endpoint is not available yet."
            );

            return;
        }


        const data =
            await response.json();


        if (
            data.success === false
        ) {

            throw new Error(
                data.error ||
                "Unable to clear history"
            );
        }


        messages = [];


        newChat();


        await loadHistory();


    }

    catch (error) {


        console.error(
            "[CLEAR HISTORY]",
            error
        );


        alert(
            "Unable to clear history:\n" +
            error.message
        );

    }
}
