<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZENO AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #080b0f;
            --sidebar: #0d1117;
            --panel: #11161c;
            --panel-hover: #171d24;
            --border: #252c35;
            --text: #e8edf2;
            --muted: #7d8895;
            --blue: #2563eb;
            --blue-hover: #1d4ed8;
            --green: #55d98b;
            --red: #ef4444;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        button,
        textarea {
            font-family: inherit;
        }

        /* =========================
           APP
        ========================= */

        .app {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            height: 100vh;

            background: var(--sidebar);
            border-right: 1px solid var(--border);

            display: flex;
            flex-direction: column;

            padding: 18px;

            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;

            margin-bottom: 25px;
        }

        .logo {
            width: 42px;
            height: 42px;

            object-fit: contain;

            border-radius: 10px;

            background: #000;
        }

        .brand-name {
            font-size: 20px;
            font-weight: 700;
        }

        .brand-sub {
            color: var(--muted);
            font-size: 11px;
            margin-top: 3px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .new-chat {
            width: 100%;

            padding: 12px;

            border-radius: 10px;

            border: 1px solid var(--border);

            background: var(--panel);

            color: white;

            cursor: pointer;

            text-align: left;

            font-size: 14px;

            margin-bottom: 22px;

            transition: 0.2s;
        }

        .new-chat:hover {
            background: var(--panel-hover);
        }

        /* =========================
           HISTORY
        ========================= */

        .history-heading {
            color: var(--muted);

            font-size: 11px;

            margin-bottom: 10px;

            padding: 0 4px;
        }

        .history-list {
            flex: 1;

            overflow-y: auto;
        }

        .history-item {
            padding: 10px;

            margin-bottom: 4px;

            border-radius: 8px;

            color: #b8c0c9;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: 0.2s;
        }

        .history-item:hover {
            background: var(--panel-hover);

            color: white;
        }

        .history-empty {
            color: #56616e;

            font-size: 12px;

            padding: 10px 5px;
        }

        .clear-history {
            border: 1px solid var(--border);

            background: transparent;

            color: #858f9c;

            padding: 9px;

            border-radius: 8px;

            cursor: pointer;

            margin-top: 12px;
        }

        .clear-history:hover {
            background: var(--panel-hover);

            color: white;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;

            min-width: 0;

            height: 100vh;

            display: flex;

            flex-direction: column;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 62px;

            border-bottom: 1px solid var(--border);

            display: flex;

            align-items: center;

            padding: 0 25px;

            flex-shrink: 0;
        }

        .top-title {
            font-size: 15px;

            font-weight: 600;
        }

        .online {
            margin-left: auto;

            font-size: 12px;

            color: var(--muted);
        }

        /* =========================
           CHAT
        ========================= */

        .chat-area {
            flex: 1;

            overflow-y: auto;

            padding: 35px 25px;

            scroll-behavior: smooth;
        }

        .chat-container {
            width: 100%;

            max-width: 900px;

            margin: auto;
        }

        /* =========================
           WELCOME
        ========================= */

        .welcome {
            min-height: 70vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;
        }

        .welcome-box {
            max-width: 650px;
        }

        .welcome-logo {
            width: 80px;

            height: 80px;

            object-fit: contain;

            margin-bottom: 18px;

            border-radius: 18px;
        }

        .welcome h1 {
            font-size: 34px;

            margin-bottom: 12px;
        }

        .welcome p {
            color: var(--muted);

            line-height: 1.6;

            margin-bottom: 25px;
        }

        /* =========================
           SUGGESTIONS
        ========================= */

        .suggestions {
            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 9px;
        }

        .suggestion {
            background: var(--panel);

            border: 1px solid var(--border);

            padding: 11px 15px;

            border-radius: 10px;

            color: #bbc3cd;

            cursor: pointer;

            transition: 0.2s;
        }

        .suggestion:hover {
            background: var(--panel-hover);

            color: white;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            display: flex;

            margin-bottom: 28px;

            gap: 13px;

            max-width: 850px;

            animation: messageIn 0.2s ease;
        }

        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .message.user {
            margin-left: auto;

            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;

            height: 36px;

            min-width: 36px;

            border-radius: 9px;

            object-fit: contain;

            background: #000;

            padding: 3px;
        }

        .message-content {
            max-width: 760px;
        }

        .message-name {
            color: #8994a2;

            font-size: 12px;

            margin-bottom: 6px;
        }

        .message-text {
            line-height: 1.6;

            color: #e9edf1;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .user .message-text {
            background: var(--blue);

            padding: 12px 16px;

            border-radius: 13px;
        }

        .copy-button {
            background: transparent;

            border: none;

            color: #697585;

            cursor: pointer;

            font-size: 12px;

            margin-top: 7px;
        }

        .copy-button:hover {
            color: white;
        }

        /* =========================
           TYPING
        ========================= */

        .typing {
            display: flex;

            gap: 5px;

            padding: 8px 0;
        }

        .typing span {
            width: 7px;

            height: 7px;

            background: #798491;

            border-radius: 50%;

            animation: typing 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);

                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);

                opacity: 1;
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-section {
            padding: 10px 25px 20px;
        }

        .input-wrapper {
            max-width: 900px;

            margin: auto;
        }

        .input-box {
            display: flex;

            align-items: flex-end;

            background: var(--panel);

            border: 1px solid var(--border);

            border-radius: 15px;

            padding: 7px;
        }

        .input-box:focus-within {
            border-color: #3b4654;

            box-shadow:
                0 0 0 2px rgba(37, 99, 235, 0.08);
        }

        #messageInput {
            flex: 1;

            background: transparent;

            color: white;

            border: none;

            outline: none;

            resize: none;

            min-height: 44px;

            max-height: 150px;

            padding: 12px;

            font-size: 14px;
        }

        #messageInput::placeholder {
            color: #687382;
        }

        #sendButton {
            width: 44px;

            height: 44px;

            border: none;

            border-radius: 10px;

            background: var(--blue);

            color: white;

            cursor: pointer;

            font-size: 18px;

            transition: 0.2s;
        }

        #sendButton:hover {
            background: var(--blue-hover);

            transform: translateY(-1px);
        }

        #sendButton:disabled {
            opacity: 0.5;

            cursor: not-allowed;

            transform: none;
        }

        .input-info {
            text-align: center;

            color: #58636f;

            font-size: 10px;

            margin-top: 8px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .chat-area {
                padding: 25px 14px;
            }

            .input-section {
                padding: 10px 12px 15px;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .message {
                max-width: 100%;
            }

            .message-content {
                max-width: calc(100vw - 90px);
            }

            .topbar {
                padding: 0 15px;
            }
        }
    </style>
</head>


<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="brand">

            <img
                src="logo.png"
                class="logo"
                alt="ZENO AI"
                onerror="this.style.display='none'"
            >

            <div>

                <div class="brand-name">
                    ZENO AI
                </div>

                <div class="brand-sub">
                    AI + MCP + RAG
                </div>

            </div>

        </div>


        <button
            type="button"
            class="new-chat"
            id="newChatButton"
        >
            ＋ New Chat
        </button>


        <div class="history-heading">
            CHAT HISTORY
        </div>


        <div
            id="historyList"
            class="history-list"
        >

            <div class="history-empty">
                Loading history...
            </div>

        </div>


        <button
            type="button"
            class="clear-history"
            id="clearHistoryButton"
        >
            🗑 Clear History
        </button>

    </aside>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="main">

        <header class="topbar">

            <div class="top-title">
                ZENO AI
            </div>

            <div
                class="online"
                id="onlineStatus"
            >
                ● Connecting...
            </div>

        </header>


        <!-- =========================
             CHAT AREA
        ========================= -->

        <section
            id="chatArea"
            class="chat-area"
        >

            <div
                id="chatContainer"
                class="chat-container"
            >

                <div
                    id="welcome"
                    class="welcome"
                >

                    <div class="welcome-box">

                        <img
                            src="logo.png"
                            class="welcome-logo"
                            alt="ZENO AI"
                        >


                        <h1>
                            How can I help you?
                        </h1>


                        <p>
                            Ask ZENO anything.
                            AI, coding, data,
                            calculations and more.
                        </p>


                        <div class="suggestions">

                            <button
                                class="suggestion"
                                data-question="What is Artificial Intelligence?"
                            >
                                What is AI?
                            </button>


                            <button
                                class="suggestion"
                                data-question="Calculate 25 + 30"
                            >
                                Calculate
                            </button>


                            <button
                                class="suggestion"
                                data-question="What are my skills?"
                            >
                                My Skills
                            </button>


                            <button
                                class="suggestion"
                                data-question="What is the current time?"
                            >
                                Current Time
                            </button>


                            <button
                                class="suggestion"
                                data-question="What is the current Bitcoin price?"
                            >
                                ₿ Bitcoin Price
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =========================
             INPUT
        ========================= -->

        <section class="input-section">

            <div class="input-wrapper">

                <div class="input-box">

                    <textarea
                        id="messageInput"
                        placeholder="Message ZENO..."
                        rows="1"
                        autocomplete="off"
                    ></textarea>


                    <button
                        type="button"
                        id="sendButton"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>


                <div class="input-info">
                    Enter to send
                    • Shift + Enter for new line
                    • ZENO can make mistakes
                </div>

            </div>

        </section>

    </main>

</div>


<script>

/* ============================================================
   ZENO AI
   LIVE RENDER BACKEND
============================================================ */


/* ============================================================
   IMPORTANT
============================================================ */

const API_URL =
    "https://zeno-ai-chatbot.onrender.com";


/* ============================================================
   ELEMENTS
============================================================ */

const input =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatArea =
    document.getElementById(
        "chatArea"
    );

const chatContainer =
    document.getElementById(
        "chatContainer"
    );

const historyList =
    document.getElementById(
        "historyList"
    );

const onlineStatus =
    document.getElementById(
        "onlineStatus"
    );

const newChatButton =
    document.getElementById(
        "newChatButton"
    );

const clearHistoryButton =
    document.getElementById(
        "clearHistoryButton"
    );


let sending = false;


/* ============================================================
   CHECK BACKEND
============================================================ */

async function checkBackend() {

    try {

        const response =
            await fetch(
                API_URL + "/",
                {
                    method: "GET"
                }
            );


        if (!response.ok) {
            throw new Error(
                "Backend unavailable"
            );
        }


        onlineStatus.textContent =
            "● Online";

        onlineStatus.style.color =
            "#55d98b";


    } catch (error) {

        console.error(
            "[ZENO BACKEND]",
            error
        );


        onlineStatus.textContent =
            "● Offline";

        onlineStatus.style.color =
            "#ef4444";
    }
}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    if (sending) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {

        input.focus();

        return;
    }


    sending = true;

    sendButton.disabled =
        true;

    input.disabled =
        true;


    const welcome =
        document.getElementById(
            "welcome"
        );


    if (welcome) {
        welcome.remove();
    }


    input.value = "";

    resizeInput();


    /* USER MESSAGE */

    renderMessage(
        "user",
        message
    );


    /* TYPING */

    showTyping();


    try {

        console.log(
            "[ZENO] Sending:",
            message
        );


        const response =
            await fetch(
                API_URL + "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message:
                                message
                        })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();


            throw new Error(
                "HTTP " +
                response.status +
                " " +
                errorText
            );
        }


        const data =
            await response.json();


        console.log(
            "[ZENO] Response:",
            data
        );


        removeTyping();


        /*
         * Your FastAPI backend
         * returns:
         *
         * {
         *   "response": "..."
         * }
         */

        let answer =
            data.response;


        if (
            answer === undefined ||
            answer === null
        ) {

            answer =
                data.answer ||
                data.message ||
                data.result ||
                data;
        }


        if (
            typeof answer !==
            "string"
        ) {

            answer =
                JSON.stringify(
                    answer,
                    null,
                    2
                );
        }


        renderMessage(
            "assistant",
            answer
        );


        /*
         * Refresh chat history
         */

        await loadHistory();


    } catch (error) {

        removeTyping();


        console.error(
            "[ZENO ERROR]",
            error
        );


        renderMessage(
            "assistant",

            "⚠️ Unable to connect to ZENO AI.\n\n" +

            "Please check the backend:\n" +

            API_URL +

            "\n\nError: " +

            error.message
        );


    } finally {

        sending = false;

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();
    }
}


/* ============================================================
   RENDER MESSAGE
============================================================ */

function renderMessage(
    role,
    text
) {

    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " +
        role;


    const avatar =
        document.createElement(
            "img"
        );


    avatar.className =
        "avatar";

    avatar.src =
        "logo.png";

    avatar.alt =
        "ZENO AI";


    const content =
        document.createElement(
            "div"
        );


    content.className =
        "message-content";


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "message-name";


    name.textContent =
        role === "user"
            ? "You"
            : "ZENO";


    const textElement =
        document.createElement(
            "div"
        );


    textElement.className =
        "message-text";


    textElement.textContent =
        String(text);


    content.appendChild(
        name
    );


    content.appendChild(
        textElement
    );


    /*
     * COPY BUTTON
     */

    if (
        role === "assistant"
    ) {

        const copy =
            document.createElement(
                "button"
            );


        copy.type =
            "button";

        copy.className =
            "copy-button";

        copy.textContent =
            "Copy";


        copy.addEventListener(
            "click",
            async function () {

                try {

                    await navigator
                        .clipboard
                        .writeText(
                            String(text)
                        );


                    copy.textContent =
                        "Copied!";


                    setTimeout(
                        () => {

                            copy.textContent =
                                "Copy";

                        },
                        1500
                    );


                } catch (error) {

                    console.error(
                        error
                    );

                }

            }
        );


        content.appendChild(
            copy
        );
    }


    message.appendChild(
        avatar
    );


    message.appendChild(
        content
    );


    chatContainer.appendChild(
        message
    );


    scrollToBottom();
}


/* ============================================================
   TYPING
============================================================ */

function showTyping() {

    removeTyping();


    const typing =
        document.createElement(
            "div"
        );


    typing.id =
        "typingMessage";


    typing.className =
        "message assistant";


    typing.innerHTML = `

        <img
            src="logo.png"
            class="avatar"
            alt="ZENO"
        >

        <div class="message-content">

            <div class="message-name">
                ZENO
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chatContainer.appendChild(
        typing
    );


    scrollToBottom();
}


/* ============================================================
   REMOVE TYPING
============================================================ */

function removeTyping() {

    const typing =
        document.getElementById(
            "typingMessage"
        );


    if (typing) {
        typing.remove();
    }
}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

    setTimeout(
        function () {

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        50
    );
}


/* ============================================================
   INPUT RESIZE
============================================================ */

function resizeInput() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";
}


/* ============================================================
   LOAD HISTORY
============================================================ */

async function loadHistory() {

    try {

        const response =
            await fetch(
                API_URL +
                "/history"
            );


        /*
         * If backend doesn't have
         * history endpoint.
         */

        if (
            response.status ===
            404
        ) {

            historyList.innerHTML = `

                <div class="history-empty">
                    History endpoint not found
                </div>

            `;

            return;
        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        /*
         * Support both:
         *
         * []
         *
         * and
         *
         * {
         *   "history": []
         * }
         */

        let history = [];


        if (
            Array.isArray(data)
        ) {

            history =
                data;

        } else if (
            Array.isArray(
                data.history
            )
        ) {

            history =
                data.history;
        }


        historyList.innerHTML =
            "";


        if (
            history.length ===
            0
        ) {

            historyList.innerHTML = `

                <div class="history-empty">
                    No conversations yet
                </div>

            `;

            return;
        }


        /*
         * Display newest first
         */

        history
            .slice()
            .reverse()
            .forEach(
                function (chat) {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "history-item";


                    const userMessage =
                        chat.user_message ||
                        chat.message ||
                        chat.question ||
                        "Chat";


                    const botResponse =
                        chat.bot_response ||
                        chat.ai_response ||
                        chat.response ||
                        chat.answer ||
                        "";


                    item.textContent =
                        userMessage;


                    item.title =
                        userMessage;


                    /*
                     * Open history
                     */

                    item.addEventListener(
                        "click",
                        function () {

                            chatContainer.innerHTML =
                                "";


                            renderMessage(
                                "user",
                                userMessage
                            );


                            if (
                                botResponse
                            ) {

                                renderMessage(
                                    "assistant",
                                    botResponse
                                );
                            }

                        }
                    );


                    historyList.appendChild(
                        item
                    );

                }
            );


    } catch (error) {

        console.warn(
            "[HISTORY]",
            error
        );


        historyList.innerHTML = `

            <div class="history-empty">
                Unable to load history
            </div>

        `;
    }
}


/* ============================================================
   CLEAR HISTORY
============================================================ */

async function clearHistory() {

    const confirmDelete =
        confirm(
            "Delete all chat history?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                API_URL +
                "/history",
                {
                    method: "DELETE"
                }
            );


        if (
            response.status ===
            404
        ) {

            alert(
                "History endpoint is not available on the backend."
            );

            return;
        }


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }


        await response.json();


        newChat();


        await loadHistory();


    } catch (error) {

        console.error(
            "[CLEAR HISTORY]",
            error
        );


        alert(
            "Could not clear history.\n\n" +

/* ============================================================
   SUGGESTIONS
============================================================ */

function attachSuggestionEvents() {

    document
        .querySelectorAll(
            ".suggestion"
        )
        .forEach(
            function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        input.value =
                            this.dataset.question;


                        resizeInput();


                        sendMessage();
                    }
                );

            }
        );
}


/* ============================================================
   ENTER TO SEND
============================================================ */

input.addEventListener(
    "keydown",
    function (event) {

        /*
         * ENTER = SEND
         *
         * SHIFT + ENTER =
         * NEW LINE
         */

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();
        }
    }
);
